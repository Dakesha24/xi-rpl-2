<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Penelitian 11 RPL 2</title>
  <meta name="description" content="Halaman perpisahan siswa berbasis QR Code dengan pesan dan quote unik untuk setiap siswa.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <picture class="background-picture">
      <source srcset="assets/foto-bersama-potrait.png" media="(max-width: 768px) and (orientation: portrait)">
      <img class="background-image" src="assets/foto-bersama.png" alt="Foto bersama siswa">
    </picture>
    <div class="background-overlay"></div>

    <section class="content-panel">
      <article id="student-card" class="letter-card hidden" aria-live="polite">
        <button id="student-card-tab" class="letter-tab" type="button" aria-expanded="true" aria-controls="student-card-body">
          <span class="letter-tab__dot"></span>
          <span class="letter-tab__line"></span>
        </button>
        <div id="student-card-body" class="letter-body">
          <blockquote id="student-quote" class="quote"></blockquote>
          <p id="student-name" class="student-name"></p>
          <p id="student-message" class="message"></p>
        </div>
      </article>

      <article id="empty-state" class="letter-card state-copy hidden" aria-live="polite">
        <button id="empty-state-tab" class="letter-tab" type="button" aria-expanded="true" aria-controls="empty-state-body">
          <span class="letter-tab__dot"></span>
          <span class="letter-tab__line"></span>
        </button>
        <div id="empty-state-body" class="letter-body">
          <p id="state-message" class="message"></p>
        </div>
      </article>
    </section>

    <footer class="site-footer">
      <p id="footer-text">SMK Contoh Nusantara | Angkatan 2026</p>
    </footer>
  </main>

  <script src="students.js"></script>
  <script src="script.js"></script>
</body>
</html>
